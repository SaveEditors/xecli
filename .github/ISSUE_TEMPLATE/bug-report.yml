name: Bug report
description: Report a reproducible problem in XeCLI.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Provide enough detail to reproduce the issue cleanly. Include the command or XeTerminal action, the result, and the affected area. Remove CPU keys, console IDs, public IPs, gamertags, and local paths before attaching logs or screenshots.
  - type: input
    id: area
    attributes:
      label: Area
      description: Which subsystem is affected
      placeholder: XeTerminal, XBDM, JRPC2, FTP, XEX, Ghidra, FATX, installer
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: XeCLI version
      description: Output of `rgh --version` or the release tag
      placeholder: v2.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, package type, console setup, and relevant plugin versions
      placeholder: Windows 11, v2.0.0 installer, RGH 3 Jasper, XBDM + JRPC2 enabled
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or action
      description: Paste the exact command or describe the XeTerminal action and screen
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Paste sanitized terminal output, stack traces, or screenshots
      render: text
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Include reconnect behavior, console state, XeTerminal theme, or any workaround found
    validations:
      required: false
