name: Bug report
description: Report a reproducible problem in XeCLI.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Provide enough detail to reproduce the issue cleanly. Include exact command lines, output, and whether the problem is XBDM, JRPC2, FTP, Ghidra, GOD conversion, or packaging related.
  - type: input
    id: area
    attributes:
      label: Area
      description: Which subsystem is affected
      placeholder: status, xbdm, jrpc2, ftp, xex, ghidra, god, packaging
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: XeCLI version
      description: Output of `rgh --version` or the release tag
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, and console setup summary
      placeholder: Windows 11, self-contained release, RGH 3 Jasper, XBDM + JRPC2 enabled
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command used
      description: Paste the exact command
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Paste terminal output, stack traces, or screenshots
      render: text
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Include reconnect behavior, console state, plugin versions, or any workaround found
    validations:
      required: false
