name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore XeCLI.sln

      - name: Build
        run: dotnet build XeCLI.sln -c Release --no-restore

      - name: Publish win-x64
        run: >
          dotnet publish src/Xbox360.Remote.Cli/Xbox360.Remote.Cli.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XeCLI-win-x64
          path: out/win-x64
