name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore XeCLI.sln

      - name: Build
        run: dotnet build XeCLI.sln -c Release --no-restore

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Publish win-x64
        shell: pwsh
        run: .\scripts\publish-release.ps1 -Runtime win-x64 -Output out\win-x64

      - name: Publish win-x86
        shell: pwsh
        run: .\scripts\publish-release.ps1 -Runtime win-x86 -Output out\win-x86

      - name: Verify published win-x64 release
        shell: pwsh
        run: .\scripts\verify-release.ps1 -PublishDir out\win-x64 -BuildDir src\Xbox360.Remote.Cli\bin\Release\net10.0-windows

      - name: Verify published win-x86 release
        shell: pwsh
        run: .\scripts\verify-release.ps1 -PublishDir out\win-x86 -BuildDir src\Xbox360.Remote.Cli\bin\Release\net10.0-windows

      - name: Package win-x64
        shell: pwsh
        run: .\scripts\package-release.ps1 -PublishDir out\win-x64 -OutputDir out\release -Version "${{ github.ref_name }}" -Runtime win-x64

      - name: Package win-x86
        shell: pwsh
        run: .\scripts\package-release.ps1 -PublishDir out\win-x86 -OutputDir out\release -Version "${{ github.ref_name }}" -Runtime win-x86

      - name: Smoke test packaged win-x64 zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem out\release -Filter "XeCLI-*-win-x64.zip" -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          .\scripts\smoke-test-release-zip.ps1 -ZipPath $zip

      - name: Smoke test packaged win-x86 zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem out\release -Filter "XeCLI-*-win-x86.zip" -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          .\scripts\smoke-test-release-zip.ps1 -ZipPath $zip

      - name: Build win-x64 installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -PublishDir out\win-x64 -OutputDir out\installer -Version "${{ github.ref_name }}" -SkipPublish

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/release/*.zip
            out/release/*.sha256
            out/installer/*.exe
